<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#171717">
<title>Room Reset – Stufe 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header>
    <div><strong>ROOM RESET</strong><span>Stufe 1 · Jugendzimmer</span></div>
    <div id="progress">0 / 8</div>
  </header>
  <section id="stage" aria-label="Zimmer">
    <img id="room" src="level1-room.jpg" alt="">
    <div id="playfield"></div>
    <div id="message">Ziehe die herumliegenden Dinge an ihren richtigen Platz.</div>
  </section>
  <div id="finish">
    <div class="card"><h1>Aufgeräumt!</h1><p>Alle 8 Gegenstände sind an ihrem Platz.</p><button onclick="location.reload()">Nochmal</button></div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
