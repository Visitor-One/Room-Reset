<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d8c6ad">
<title>Room Reset – Stufe 1</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
#game{position:fixed;inset:0;background:linear-gradient(#b9d6e7 0 12%,#e6dccd 12% 67%,#b58c62 67%);overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:67%;background:
linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),
linear-gradient(#e9dfd0,#d9cbb7);background-size:85px 100%}
.floor{position:absolute;left:0;right:0;bottom:0;height:33%;background:
repeating-linear-gradient(100deg,#a9794f 0 4px,#bd8c60 4px 74px,#8f623f 75px 78px)}
.floor:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.22))}
.base{position:absolute;left:0;right:0;top:65.5%;height:2.2%;background:#f5f0e9;box-shadow:0 2px 5px #745b46}
.window{position:absolute;left:6%;top:8%;width:25%;height:34%;border:10px solid #f3eee6;background:linear-gradient(#92c8e5 0 65%,#84ad6e 65%);box-shadow:0 7px 14px #0003}
.window:before,.window:after{content:"";position:absolute;background:#eee}
.window:before{left:48%;top:0;width:5px;height:100%}.window:after{left:0;top:49%;height:5px;width:100%}
.curtain{position:absolute;top:5%;width:5.5%;height:43%;background:linear-gradient(90deg,#768b91,#b8c6c8,#71868b);border-radius:0 0 15px 15px;box-shadow:2px 5px 8px #0002}
.c1{left:2.5%;transform:skewX(2deg)}.c2{left:31%;transform:skewX(-2deg)}
.poster{position:absolute;left:39%;top:9%;width:13%;height:22%;padding:5px;background:#eee;box-shadow:0 4px 8px #0003;transform:rotate(-1deg)}
.poster div{width:100%;height:100%;background:linear-gradient(145deg,#17243b,#76576f 45%,#e4a76d);display:flex;align-items:flex-end;justify-content:center;color:#fff;font-weight:800;font-size:12px;padding-bottom:8px}
.bed{position:absolute;left:3%;bottom:11%;width:39%;height:25%;z-index:3}
.bed .frame{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#ad805d,#80583b);border-radius:6px;box-shadow:0 9px 14px #0004}
.bed .mattress{position:absolute;left:2%;right:1%;bottom:22%;height:55%;background:#eee8df;border-radius:8px 12px 5px 5px;box-shadow:inset 0 -8px 12px #0001}
.duvet{position:absolute;left:20%;right:2%;bottom:25%;height:48%;background:linear-gradient(150deg,#627d88,#849da5);border-radius:15px 12px 6px 12px;transform:rotate(1deg);box-shadow:inset 0 0 12px #0002}
.pillow{position:absolute;left:5%;bottom:58%;width:28%;height:26%;background:#f5f1e9;border-radius:45%;box-shadow:0 3px 7px #0002}
.desk{position:absolute;right:3%;bottom:16%;width:31%;height:26%;z-index:3}
.desktop{position:absolute;top:0;left:0;right:0;height:13%;background:linear-gradient(#a8734d,#805334);border-radius:4px;box-shadow:0 4px 7px #0004}
.leg{position:absolute;top:10%;bottom:0;width:5%;background:#755039}.leg.l{left:5%}.leg.r{right:5%}
.monitor{position:absolute;left:28%;bottom:90%;width:39%;height:52%;background:#25272a;border:5px solid #34383b;border-radius:5px;box-shadow:0 5px 10px #0004}
.monitor:before{content:"";position:absolute;inset:5%;background:linear-gradient(145deg,#213449,#406273)}
.monitor:after{content:"";position:absolute;left:45%;top:100%;width:10%;height:24%;background:#4b4d4e}
.lamp{position:absolute;right:5%;bottom:96%;width:18%;height:42%}
.lamp:before{content:"";position:absolute;bottom:0;left:43%;width:8%;height:70%;background:#444;transform:rotate(13deg);transform-origin:bottom}
.lamp:after{content:"";position:absolute;top:0;left:28%;width:45%;height:27%;background:#5c665e;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.shelf{position:absolute;right:3%;top:11%;width:23%;height:31%;background:#8b6246;border:7px solid #725039;box-shadow:0 6px 12px #0003;z-index:2}
.shelf:before,.shelf:after{content:"";position:absolute;left:0;right:0;height:6px;background:#725039}.shelf:before{top:32%}.shelf:after{top:65%}
.books{position:absolute;left:7%;top:6%;height:24%;display:flex;align-items:flex-end;gap:3px}
.books i{display:block;width:10px;height:38px;background:#6c7e8c}.books i:nth-child(2){height:31px;background:#a86855}.books i:nth-child(3){height:42px;background:#8a865a}.books i:nth-child(4){height:35px;background:#565f73}
.plant{position:absolute;right:9%;top:38%;width:9%;height:14%;z-index:4}.pot{position:absolute;bottom:0;left:28%;width:45%;height:35%;background:#b66e4b;clip-path:polygon(8% 0,92% 0,80% 100%,20% 100%)}.leaf{position:absolute;width:42%;height:55%;background:#607d52;border-radius:100% 0 100% 0;transform-origin:bottom}.leaf.a{left:30%;transform:rotate(-25deg)}.leaf.b{left:43%;transform:rotate(25deg)}.leaf.c{left:31%;top:-15%;transform:rotate(3deg)}
.rug{position:absolute;left:39%;bottom:3%;width:28%;height:19%;background:#8c6d5b;border-radius:50%;transform:skewX(-8deg);box-shadow:0 4px 8px #0003;z-index:2}
.basket{position:absolute;right:1.5%;bottom:3%;width:12%;height:15%;background:repeating-linear-gradient(90deg,#9d7650 0 6px,#b58a5e 6px 12px);border:4px solid #80603f;border-radius:5px 5px 15px 15px;z-index:4}
.basket:before{content:"WÄSCHE";position:absolute;top:34%;left:9%;right:9%;padding:3px 0;text-align:center;background:#e8dfcfcc;font-size:10px;font-weight:800;color:#57483d}
.bin{position:absolute;right:15%;bottom:4%;width:7%;height:13%;background:linear-gradient(90deg,#555,#777,#4b4b4b);clip-path:polygon(10% 0,90% 0,78% 100%,22% 100%);z-index:4}
.target{outline:0 solid #77e09a;transition:.15s}.target.hot{outline:4px solid #77e09a;filter:brightness(1.12)}
.item{position:absolute;z-index:10;touch-action:none;cursor:grab;filter:drop-shadow(0 5px 4px #0005)}
.item.drag{z-index:30;transform:scale(1.08);cursor:grabbing}
#shirt{left:47%;bottom:12%;width:10%;height:9%;background:#506b91;clip-path:polygon(22% 0,38% 10%,62% 10%,78% 0,100% 25%,83% 42%,72% 32%,72% 100%,28% 100%,28% 32%,17% 42%,0 25%)}
#sock{left:30%;bottom:4%;width:4%;height:9%;background:#d5d0c7;border-radius:4px 4px 12px 12px;transform:rotate(22deg)}
#book{left:56%;bottom:23%;width:8%;height:4.5%;background:#7c3e38;border:2px solid #542d2a;border-radius:2px;transform:rotate(-12deg)}
#cup{right:8%;bottom:38%;width:5%;height:7%;background:#d5c6a5;border-radius:2px 2px 8px 8px}
#cup:after{content:"";position:absolute;right:-35%;top:20%;width:45%;height:45%;border:4px solid #d5c6a5;border-left:0;border-radius:0 50% 50% 0}
#paper{left:69%;bottom:7%;width:7%;height:6%;background:#f1ede4;transform:rotate(15deg);clip-path:polygon(0 8%,20% 0,40% 10%,65% 2%,100% 16%,91% 100%,10% 92%)}
#pencil{right:28%;bottom:31%;width:8%;height:1.5%;background:#d4a331;border-radius:5px;transform:rotate(16deg)}
#hud{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:#111c;color:#fff;padding:9px 15px;border-radius:18px;backdrop-filter:blur(8px);font-size:14px;white-space:nowrap}
#hud b{font-size:16px}
#tip{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:#fffdf1e8;color:#302b25;padding:8px 13px;border-radius:15px;font-size:12px;box-shadow:0 3px 12px #0003;white-space:nowrap}
#done{display:none;position:absolute;inset:0;z-index:100;background:#111b;backdrop-filter:blur(5px);align-items:center;justify-content:center}
.card{background:#f5efe4;color:#30281f;width:min(86%,420px);padding:25px;text-align:center;border-radius:22px;box-shadow:0 15px 50px #0008}.card h1{margin:0 0 8px}.card button{border:0;background:#283d4a;color:#fff;padding:12px 22px;border-radius:14px;font-size:16px;font-weight:700}
@media(max-height:500px){#hud{top:5px;padding:6px 12px}.poster{height:19%}#tip{bottom:5px}}
</style>
</head>
<body>
<div id="game">
 <div class="wall"></div><div class="floor"></div><div class="base"></div>
 <div class="window"></div><div class="curtain c1"></div><div class="curtain c2"></div>
 <div class="poster"><div>NIGHT<br>CITY</div></div>
 <div class="shelf target" data-kind="book"><div class="books"><i></i><i></i><i></i><i></i></div></div>
 <div class="plant"><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div><div class="pot"></div></div>
 <div class="bed"><div class="frame"></div><div class="mattress"></div><div class="duvet"></div><div class="pillow"></div></div>
 <div class="rug"></div>
 <div class="desk target" data-kind="desk"><div class="desktop"></div><div class="leg l"></div><div class="leg r"></div><div class="monitor"></div><div class="lamp"></div></div>
 <div class="basket target" data-kind="laundry"></div>
 <div class="bin target" data-kind="trash"></div>

 <div class="item" id="shirt" data-home="laundry" aria-label="Shirt"></div>
 <div class="item" id="sock" data-home="laundry" aria-label="Socke"></div>
 <div class="item" id="book" data-home="book" aria-label="Buch"></div>
 <div class="item" id="cup" data-home="desk" aria-label="Tasse"></div>
 <div class="item" id="paper" data-home="trash" aria-label="Papier"></div>
 <div class="item" id="pencil" data-home="desk" aria-label="Stift"></div>

 <div id="hud">ROOM RESET · Stufe 1 &nbsp; <b><span id="count">0</span>/6</b></div>
 <div id="tip">Gegenstände greifen und an ihren Platz ziehen</div>
 <div id="done"><div class="card"><h1>Zimmer aufgeräumt!</h1><p>Stufe 1 geschafft · 6 von 6 Gegenständen</p><button onclick="location.reload()">Nochmal spielen</button></div></div>
</div>
<script>
const items=[...document.querySelectorAll('.item')], targets=[...document.querySelectorAll('.target')];
let solved=0, active=null, ox=0, oy=0;
function centerIn(el,t){
 const g=document.getElementById('game').getBoundingClientRect(), r=t.getBoundingClientRect(), e=el.getBoundingClientRect();
 el.style.left=(r.left-g.left+(r.width-e.width)/2)+'px';
 el.style.top=(r.top-g.top+(r.height-e.height)/2)+'px';
 el.style.right='auto'; el.style.bottom='auto';
}
function hitTarget(x,y,kind){
 return targets.find(t=>{
   if(t.dataset.kind!==kind)return false;
   const r=t.getBoundingClientRect();
   return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
 });
}
items.forEach(el=>{
 el.addEventListener('pointerdown',e=>{
   if(el.dataset.done)return;
   active=el; el.setPointerCapture(e.pointerId);
   const r=el.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
   el.classList.add('drag');
 });
 el.addEventListener('pointermove',e=>{
   if(active!==el)return;
   const g=document.getElementById('game').getBoundingClientRect();
   el.style.left=(e.clientX-g.left-ox)+'px'; el.style.top=(e.clientY-g.top-oy)+'px';
   el.style.right='auto';el.style.bottom='auto';
   targets.forEach(t=>t.classList.toggle('hot',t===hitTarget(e.clientX,e.clientY,el.dataset.home)));
 });
 el.addEventListener('pointerup',e=>{
   if(active!==el)return;
   targets.forEach(t=>t.classList.remove('hot')); el.classList.remove('drag');
   const t=hitTarget(e.clientX,e.clientY,el.dataset.home);
   if(t){
     centerIn(el,t); el.dataset.done='1'; el.style.pointerEvents='none'; el.style.opacity='.72';
     solved++; document.getElementById('count').textContent=solved;
     if(solved===items.length)setTimeout(()=>document.getElementById('done').style.display='flex',350);
   }
   active=null;
 });
});
</script>
</body>
</html>
